name: Publicar puente de GitHub Pages
run-name: Publicar puente hacia GameZone

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL de producción revisada de GameZone
        required: true
        default: https://gamezone-impaul17.netlify.app
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Preparar solo el puente estático
        run: node --experimental-strip-types scripts/build-pages-bridge.mjs
        env:
          PAGES_BRIDGE_TARGET: ${{ inputs.target_url }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .data/pages-bridge
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
