[build]
  command = "node scripts/verify-netlify-commit.mjs && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keep the maintained OpenNext adapter unpinned. API-created sites need this
# explicit registration so .next is packaged as a server application.
# Production credentials and auth URLs belong in scoped environment settings,
# never in this file. Do not add an SPA fallback over the Next.js routes.
